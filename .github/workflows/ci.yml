name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
          - name: Windows x64
            runner: windows-2025
          - name: macOS arm64
            runner: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up toolchains
        shell: bash
        run: |
          npm install --global pnpm@11.10.0
          rustup set profile minimal
          rustup toolchain install 1.90.0 --component clippy,rustfmt

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust service and libraries
        run: cargo test --locked --workspace --all-targets --features test-engine

      - name: Build fixture-enabled sidecar
        run: cargo build --locked -p seda-cli --features test-engine

      - name: Check TypeScript
        run: pnpm check

      - name: Test universal and managed clients
        run: pnpm test

      - name: Build JavaScript packages
        run: pnpm build

  browser:
    name: Browser microphone
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up toolchains
        shell: bash
        run: |
          npm install --global pnpm@11.10.0
          rustup set profile minimal
          rustup toolchain install 1.90.0

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Build browser client and fixture sidecar
        run: |
          pnpm --filter @bearlyai/seda build
          cargo build --locked -p seda-cli --features test-engine

      - name: Test browser microphone flow
        run: pnpm test:browser
