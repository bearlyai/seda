name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
          - name: Windows x64
            runner: windows-2025
          - name: macOS arm64
            runner: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up toolchains
        shell: bash
        run: |
          npm install --global pnpm@11.10.0
          rustup set profile minimal
          rustup toolchain install 1.90.0 --component clippy,rustfmt

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust service and libraries
        run: cargo test --locked --workspace --all-targets --features test-engine

      - name: Build fixture-enabled sidecar
        run: cargo build --locked -p seda-cli --features test-engine

      - name: Check TypeScript
        run: pnpm check

      - name: Test universal and managed clients
        run: pnpm test

      - name: Build JavaScript packages
        run: pnpm build

  browser:
    name: Browser microphone
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up toolchains
        shell: bash
        run: |
          npm install --global pnpm@11.10.0
          rustup set profile minimal
          rustup toolchain install 1.90.0

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Build browser packages and fixture sidecar
        run: |
          pnpm --filter @bearlyai/seda build
          pnpm --filter @bearlyai/seda-browser build
          pnpm exec vite build examples/browser-demo --base /seda/ --outDir ../../dist/pages --emptyOutDir
          cargo build --locked -p seda-cli --features test-engine

      - name: Test browser runtimes and microphone flows
        run: pnpm test:browser

  sdk:
    name: ${{ matrix.name }} SDK
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Python
            sdk: python
            runner: ubuntu-24.04
          - name: Go
            sdk: go
            runner: ubuntu-24.04
          - name: Swift
            sdk: swift
            runner: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        if: matrix.sdk == 'python'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Go
        if: matrix.sdk == 'go'
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: "1.23"
          cache-dependency-path: sdks/go/go.sum

      - name: Build fixture sidecar
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install 1.90.0
          cargo build --locked -p seda-cli --features test-engine

      - name: Test SDK unit and live protocol integration
        shell: bash
        env:
          SEDA_TEST_BASE_URL: http://127.0.0.1:17331
          SEDA_TEST_TOKEN: sdk-integration-token-000000000000
        run: |
          ./target/debug/seda serve \
            --engine fixture \
            --listen 127.0.0.1:17331 \
            --token "$SEDA_TEST_TOKEN" > "$RUNNER_TEMP/seda-ready.json" \
            2> "$RUNNER_TEMP/seda-sdk.log" &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..50}; do
            if curl --fail --silent \
              -H "Authorization: Bearer $SEDA_TEST_TOKEN" \
              "$SEDA_TEST_BASE_URL/v1/status" >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/seda-sdk.log"
              exit 1
            fi
            sleep 0.1
          done
          test "$ready" -eq 1
          case "${{ matrix.sdk }}" in
            python)
              python -m venv "$RUNNER_TEMP/seda-python"
              "$RUNNER_TEMP/seda-python/bin/pip" install ./sdks/python
              "$RUNNER_TEMP/seda-python/bin/python" \
                -m unittest discover -s sdks/python/tests -v
              ;;
            go)
              (cd sdks/go && go test ./...)
              ;;
            swift)
              swift test
              ;;
          esac
