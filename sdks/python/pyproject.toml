[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bearlyai-seda"
version = "0.2.0"
description = "Typed Python client for the local Seda speech runtime"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Bearly AI" }]
dependencies = ["websocket-client==1.8.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/bearlyai/seda"
Repository = "https://github.com/bearlyai/seda"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seda = ["py.typed"]
