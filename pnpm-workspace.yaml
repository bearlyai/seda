packages:
  - "packages/*"

# Quarantine newly published registry packages for seven full days. Strict mode
# fails instead of silently adding an exception, and untrusted lockfiles are
# rechecked so frozen installs cannot bypass the policy.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
trustLockfile: false

overrides:
  # Vite/PostCSS uses only nanoid's stable top-level API. Pin the already-aged,
  # unaffected ESM release while the new 3.x security patch is quarantined.
  nanoid: "5.1.16"
  sharp: "0.35.3"

allowBuilds:
  esbuild: true
  onnxruntime-node: false
  protobufjs: false
  sharp: false
